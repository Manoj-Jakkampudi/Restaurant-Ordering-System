<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Restaurant Ordering System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Menu</a>
                <a class="nav-link" href="/kitchen">Kitchen</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Your Cart</h1>
        <div id="cart-items"></div>
        <div class="mt-4">
            <h5>Select Payment Method:</h5>
            <select id="payment-method" class="form-select mb-3">
                <option value="">Choose...</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="UPI">UPI</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
            </select>
            <div class="text-center">
                <button class="btn btn-success" onclick="placeOrder()">Place Order</button>
                <a href="/" class="btn btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>
    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartDiv = document.getElementById('cart-items');
            cartDiv.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'card mb-3';
                itemDiv.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title">${item.name}</h5>
                        <p class="card-text">Quantity: ${item.quantity}</p>
                        <p class="card-text">Price: ₹${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                `;
                cartDiv.appendChild(itemDiv);
            });
            const totalDiv = document.createElement('div');
            totalDiv.className = 'text-center mt-3';
            totalDiv.innerHTML = `<h4>Total: ₹${total.toFixed(2)}</h4>`;
            cartDiv.appendChild(totalDiv);
        }

        async function placeOrder() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            const paymentMethod = document.getElementById('payment-method').value;
            if (!paymentMethod) {
                alert('Please select a payment method!');
                return;
            }
            const orderItems = cart.map(item => ({
                menuItemId: item.id,
                name: item.name,
                price: item.price,
                quantity: item.quantity
            }));
            const response = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: orderItems, paymentMethod: paymentMethod })
            });
            if (response.ok) {
                alert('Order placed successfully!');
                localStorage.removeItem('cart');
                loadCart();
            } else {
                alert('Failed to place order');
            }
        }

        loadCart();
    </script>
</body>
</html>
