<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 5px;
            border-radius: 5px;
        }
        .card {
            position: relative;
        }
        .original-price {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Restaurant Ordering System</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/cart">Cart</a>
                <a class="nav-link" href="/kitchen">Kitchen</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Restaurant Menu</h1>
        <div id="menu-items" class="row"></div>
        <div class="text-center mt-4">
            <a href="/cart" class="btn btn-primary">View Cart</a>
        </div>
    </div>
    <script>
        async function loadMenu() {
            const response = await fetch('/api/menu');
            const items = await response.json();
            const menuDiv = document.getElementById('menu-items');
            items.forEach(item => {
                const discountedPrice = item.price * (1 - item.discount / 100);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'col-md-4 mb-4';
                itemDiv.innerHTML = `
                    <div class="card">
                        ${item.discount > 0 ? `<div class="discount-badge">${item.discount}% OFF</div>` : ''}
                        <img src="${item.imageUrl}" class="card-img-top" alt="${item.name}" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">${item.name}</h5>
                            <p class="card-text">${item.description}</p>
                            <p class="card-text">
                                ${item.discount > 0 ? `<span class="original-price">₹${item.price}</span> ` : ''}
                                <strong>₹${discountedPrice.toFixed(2)}</strong>
                            </p>
                            <button class="btn btn-success" onclick="addToCart(${item.id}, '${item.name}', ${discountedPrice})">Add to Cart</button>
                        </div>
                    </div>
                `;
                menuDiv.appendChild(itemDiv);
            });
        }

        function addToCart(id, name, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Added to cart!');
        }

        loadMenu();
    </script>
</body>
</html>
