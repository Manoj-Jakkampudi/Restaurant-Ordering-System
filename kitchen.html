<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Kitchen Dashboard</h1>
        <div id="orders" class="row"></div>
    </div>
    <script>
        async function loadOrders() {
            const response = await fetch('/api/orders');
            const orders = await response.json();
            const ordersDiv = document.getElementById('orders');
            ordersDiv.innerHTML = '';
            orders.forEach(order => {
                const orderDiv = document.createElement('div');
                orderDiv.className = 'col-md-6 mb-4';
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `<li>${item.name} x${item.quantity}</li>`;
                });
                orderDiv.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Order #${order.id}</h5>
                            <p class="card-text">Status: <span id="status-${order.id}">${order.status}</span></p>
                            <p class="card-text">Payment: ${order.paymentMethod}</p>
                            <ul>${itemsHtml}</ul>
                            <p class="card-text"><strong>Total: ₹${order.total.toFixed(2)}</strong></p>
                            <button class="btn btn-warning" onclick="updateStatus(${order.id}, 'preparing')">Preparing</button>
                            <button class="btn btn-success" onclick="updateStatus(${order.id}, 'ready')">Ready</button>
                            <button class="btn btn-primary" onclick="updateStatus(${order.id}, 'completed')">Completed</button>
                        </div>
                    </div>
                `;
                ordersDiv.appendChild(orderDiv);
            });
        }

        async function updateStatus(id, status) {
            await fetch(`/api/orders/${id}/status?status=${status}`, { method: 'PUT' });
            document.getElementById(`status-${id}`).textContent = status;
        }

        loadOrders();
        setInterval(loadOrders, 5000); // Refresh every 5 seconds
    </script>
</body>
</html>
